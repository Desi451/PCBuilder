<form [formGroup]="registrationForm" (ngSubmit)="executeRegistrationForm()" style="max-width: 450px" class="mx-auto py-4 mt-5 rounded border border-2 border-primary">
  <h4 class="text-center my-2">Register</h4>
  <div class="form-outline mb-4 mt-5 mx-4">
    <input type="text" id="login" class="form-control" formControlName="login" />
    <label class="form-label" for="login">Username</label>
    <div class="form-text">Letters, digits, dot, dash and underscore only.</div>
  </div>

  <div class="form-outline mb-4 mx-4">
    <input type="email" id="email" class="form-control" formControlName="email" />
    <label class="form-label" for="email">Email address</label>
  </div>

  <div class="form-outline mb-4 mx-4">
    <input type="password" id="password" class="form-control" formControlName="password" />
    <label class="form-label" for="password">Password</label>
    <div class="form-text">{{ passwordHint }}</div>
  </div>

  <div class="form-outline mb-4 mx-4">
    <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword" />
    <label class="form-label" for="confirmPassword">Confirm Password</label>
  </div>

  <button type="submit" class="btn btn-primary btn-block mb-4 me-3 ms-4">Sign up</button>
  <a routerLink="/login" type="button" class="btn btn-primary btn-block mb-4">Go to login</a>
</form>
