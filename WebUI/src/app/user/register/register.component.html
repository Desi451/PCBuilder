<form [formGroup]="registrationForm" (ngSubmit)="executeRegistrationForm()" style="max-width: 400px" class="mx-auto">

  <div class="form-outline mb-4 mt-5">
    <input type="text" id="login" class="form-control" formControlName="login" />
    <label class="form-label" for="login">Username</label>
  </div>

  <div class="form-outline mb-4">
    <input type="email" id="email" class="form-control" formControlName="email" />
    <label class="form-label" for="email">Email address</label>
  </div>

  <div class="form-outline mb-4">
    <input type="password" id="password" class="form-control" formControlName="password" />
    <label class="form-label" for="password">Password</label>
  </div>

  <div class="form-outline mb-4">
    <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword" />
    <label class="form-label" for="confirmPassword">Confirm Password</label>
  </div>

  <button type="submit" class="btn btn-primary btn-block mb-4 me-3">Sign up</button>
  <a href="login" type="button" class="btn btn-primary btn-block mb-4">Login</a>
</form>
