<form [formGroup]="loginForm" (ngSubmit)="executeForm()" style="max-width: 450px" class="mx-auto py-4 my-5 rounded border border-2 border-primary">
  <h4 class="text-center my-2">Login</h4>
  <div class="form-outline mb-4 mx-4">
    <input type="text" id="login" class="form-control" formControlName="login" />
    <label class="form-label" for="login">Login or email</label>
  </div>

  <div class="form-outline mb-4 mx-4">
    <input type="password" id="password" class="form-control" formControlName="password" />
    <label class="form-label" for="password">Password</label>
  </div>

  <!-- <div class="row mb-4 mx-4">
    <div class="col mx-start">
      <a href="resetpass">Forgot password?</a>
    </div>
  </div> -->

  <button type="submit" class="btn btn-primary btn-block mb-2 me-2 mx-4">Login</button>
  <a href="register" type="button" class="btn btn-primary btn-block mb-2 mx-4">Register</a>
</form>
