<h3 class="m-2">Profile Edit</h3>

<form [formGroup]="userForm" (ngSubmit)="executeForm()" style="max-width: 450px" class="mx-auto py-4 my-5 rounded border border-2 border-primary">
  <div class="form-outline mb-4 mx-4 my-2">
    <input type="text" id="login" class="form-control my-3" formControlName="login" placeholder="login"/>
    <input type="email" id="email" class="form-control my-3" formControlName="email" placeholder="email"/>

    @if (changePassword) {
      <input type="password" id="currentPassword" class="form-control my-3" formControlName="currentPassword" placeholder="current password"/>
      <input type="password" id="newPassword" class="form-control my-3" formControlName="newPassword" placeholder="new password"/>
      <div class="form-text">{{ passwordHint }}</div>
      <input type="password" id="newPasswordRepeat" class="form-control my-3" formControlName="newPasswordRepeat" placeholder="repeat new password"/>
    }
  </div>

  <button type="submit" class="form-group btn btn-dark border border-primary btn-block ms-4">Submit</button>
  <button type="button" class="btn btn-outline-primary ms-2" (click)="togglePasswordChange()">
    @if (changePassword) {
      Keep current password
    } @else {
      Change password
    }
  </button>
</form>
<h3 class="my-3">Your configurations <i class="bi bi-pc-display"></i> </h3>
@if (isDataLoaded) {
  <app-uni-table [data]="computerList"
    [columns]="['ram','cpu', 'name']"
    [formLink]="'computer/form'"
  [viewLink]="'computer/view'"></app-uni-table>
}
