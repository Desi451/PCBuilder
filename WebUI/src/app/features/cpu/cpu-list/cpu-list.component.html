<H3> Processors </H3>


<ng-container *ngIf="isDataLoaded && isSocketLoaded">
  <app-uni-table [data]="cpuList"
                 [columns]="['cores', 'name', 'model']"
                 [formLink]="'cpu/form'"
                 [viewLink]="'cpu/view'"></app-uni-table>

<app-uni-table   [data]="socketList"
                 [columns]="['id', 'name']"
                 [formLink]="'cpu/formsocket'"></app-uni-table>
</ng-container>
