
<H3> RAM Memory </H3>


<ng-container *ngIf="isDataLoaded && isSpeedLoaded">
  <app-uni-table [data]="list"
                 [columns]="[ 'name', 'model','capacity']"
                 [formLink]="'ram/form'"
                 [viewLink]="'ram/view'"></app-uni-table>

  <app-uni-table  [data]="speedList"
                 [columns]="[ 'standard', 'freq']"
                 [formLink]="'ram/speedform'"></app-uni-table>
</ng-container>
