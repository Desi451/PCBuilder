<p>ram-form works!</p>

<form [formGroup]="ramForm" (ngSubmit)="executeForm()">
  <div class="row mx-auto">
    <div class="col-md-4 my-2">
      <input type="text" class="form-control" id="name" formControlName="name" placeholder="RAM name">
    </div>
    <div class="col-md-4 my-2 ms-1">
      <input type="text" class="form-control" id="model" formControlName="model" placeholder="RAM model">
    </div>
    <div class="col-md-2 my-2 ms-2">
      <input type="number" class="form-control" id="capacity" formControlName="capacity" placeholder="Capacity">
    </div>
  </div>

  <div class="row">

    <div class="col-md-2 ms-2 my-2">
      <div ngbDropdown
           class="d-inline-block">
        <button type="button"
                class="btn btn-outline-primary"
                id="dropdownBrand"
                ngbDropdownToggle>
          Brand list
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <button type="button"
                  *ngFor="let item of brandList"
                  (click)="updateBrand(item)"
                  ngbDropdownItem>
            {{ item.name }}
          </button>
        </div>
      </div>
      <div class="mx-3 my-2">
        <p>{{ brnd.name }}</p>
      </div>
    </div>
    <div class="col-md-2 my-2">
      <div ngbDropdown
           class="d-inline-block">
        <button class="btn btn-outline-primary"
                id="dropdownSeries"
                type="button"
                ngbDropdownToggle
                [attr.disabled]="enableSeries ? true : null">
          Series list
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <div *ngIf="seriesList && seriesList.length > 0">
            <button type="button"
                    *ngFor="let item of seriesList"
                    (click)="updateSeries(item)"
                    ngbDropdownItem>
              {{ item.name }}
            </button>
          </div>
          <div *ngIf="!seriesList || seriesList.length < 1">
            <button type="button"
                    ngbDropdownItem>no series</button>
          </div>
        </div>
      </div>
      <div *ngIf="srs.name" class="mx-3 my-2">
        <p>selected: {{ srs.name }}</p>
      </div>
    </div>

    <div class="col-md-2 my-2">
      <div ngbDropdown
           class="d-inline-block">
        <button class="btn btn-outline-primary"
                id="dropdownSeries"
                type="button"
                ngbDropdownToggle>
          Ram speed
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <div>
            <button type="button"
                    *ngFor="let item of speedsList"
                    (click)="updateSpeed(item)"
                    ngbDropdownItem>
              {{ item.standard }} {{item.freq}} Mhz
            </button>
          </div>
          <div *ngIf="!speedsList || speedsList.length < 1">
            <button type="button"
                    ngbDropdownItem>no items</button>
          </div>
        </div>
      </div>
      <div *ngIf="speed.freq" class="mx-3 my-2">
        <p>selected: {{ speed.standard }} {{speed.freq}}</p>
      </div>
    </div>


    <div class="col-md-2 my-2">
      <input type="number" class="form-control" id="noElements" formControlName="noElements" placeholder="No of Elements">
    </div>
    <div class="col-md-2 my-2">
      <input type="text" class="form-control" id="latency" formControlName="latency" placeholder="Latency">
    </div>
  </div>

  <div class="row">
    <div class="col-md-10 ms-2">
      <textarea class="form-control" id="description" formControlName="description" placeholder="Description"></textarea>
    </div>
  </div>

  <!-- Buttons -->
  <div class="row mt-2">
    <div class="col-md-6">
      <button type="submit" class="form-group btn btn-dark border border-primary btn-block">Submit</button>
    </div>
    <div class="col-md-6">
      <button *ngIf="res?.id" (click)="delete(id)" class="btn btn-danger border border-secondary btn-block">Delete</button>
    </div>
  </div>
</form>
