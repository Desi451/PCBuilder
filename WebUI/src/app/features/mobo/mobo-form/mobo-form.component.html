<p>mobo-form works!</p>

<form [formGroup]="moboForm" (ngSubmit)="executeForm()">
  <!-- First row -->
  <div class="row">
    <div class="col-md-6 my-2">
      <input type="text" class="form-control" id="name" formControlName="name" placeholder="Motherboard name">
    </div>
    <div class="col-md-6 my-2">
      <input type="text" class="form-control" id="model" formControlName="model" placeholder="Motherboard model">
    </div>
  </div>

  <!-- Second row -->
  <div class="row">
    <div class="col-md-4 my-2">
      <input type="text" class="form-control" id="chipset" formControlName="chipset" placeholder="Chipset">
    </div>
    <div class="col-md-4 my-2">
      <input type="number" class="form-control" id="maxMemory" formControlName="maxMemory" placeholder="Max Memory">
    </div>
    <div class="col-md-4 my-2">
      <input type="number" class="form-control" id="m2Slots" formControlName="m2Slots" placeholder="M.2 Slots">
    </div>
  </div>

  <!-- Third row -->
  <div class="row">
    <div class="col-md-4">
      <input type="number" class="form-control" id="caseSizeId" formControlName="caseSizeId" placeholder="Case Size ID">
    </div>
    <div class="col-md-8">
      <textarea class="form-control" id="description" formControlName="description" placeholder="Description"></textarea>
    </div>
  </div>

  <!-- Fourth row -->
  <div class="row">
    <div class="col-md-4">
      <input type="number" class="form-control" id="seriesId" formControlName="seriesId" placeholder="Series ID">
    </div>
    <div class="col-md-4">
      <input type="number" class="form-control" id="socketCpuId" formControlName="socketCpuId" placeholder="Socket CPU ID">
    </div>
  </div>

  <!-- Buttons -->
  <div class="row mt-2">
    <div class="col-md-6">
      <button type="submit" class="form-group btn btn-dark border border-primary btn-block">Submit</button>
    </div>
    <div class="col-md-6">
      <button *ngIf="res?.id" (click)="delete(id)" class="btn btn-danger border border-secondary btn-block">Delete</button>
    </div>
  </div>
</form>
