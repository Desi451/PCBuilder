<h3 class="my-3">SSD drive <i class="bi bi-device-ssd"></i> </h3>

  <div style="max-width: 650px" class="text-center rounded border border-2 border-primary mx-auto p-3">
    <h2 class="my-3"> {{res.name}} </h2>
    <p>Model: {{res.model}} Socket: {{slot.name}}</p>
    <p>Series: {{srs.name}} </p>
    <p> Capacity: {{res.capacity}} GB </p>
    <p> Read speed: {{res.maxRead}} MBps |  Write speed:{{res.maxWrite}} MBps</p>
    <p class="text-start ms-4" >Description:</p>
    <p>{{res.description}}</p>
  </div>
