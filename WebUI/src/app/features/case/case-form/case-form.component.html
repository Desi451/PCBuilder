<p>case-form works!</p>

<form [formGroup]="caseForm"
      (ngSubmit)="executeForm()">
  <div class="d-flex flex-row my-2">
    <div class="d-flex flex-column">
      <input type="text"
             class="form-control"
             id="name"
             formControlName="name"
             placeholder="Case name">
    </div>
    <div class="d-flex flex-column">
      <input type="text"
             class="form-control"
             id="model"
             formControlName="model"
             placeholder="Case model">
    </div>
  </div>

  <div class="d-flex flex-row my-2">
    <div class="d-flex flex-column">
      <input type="number"
             class="form-control"
             id="height"
             formControlName="height"
             placeholder="Height">
    </div>
    <div class="d-flex flex-column">
      <input type="number"
             class="form-control"
             id="width"
             formControlName="width"
             placeholder="Width">
    </div>
    <div class="d-flex flex-column">
      <input type="number"
             class="form-control"
             id="deepth"
             formControlName="deepth"
             placeholder="Deepth">
    </div>
  </div>

  <div class="d-flex flex-row my-2">
    <div class="d-flex flex-column"
         style="width: 200px;">
      <div ngbDropdown
           class="d-inline-block">
        <button type="button"
                class="btn btn-outline-primary"
                id="dropdownCaseSize"
                ngbDropdownToggle>
          Case Size
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <button type="button"
                  *ngFor="let item of caseSizesList"
                  (click)="updateCaseSize(item)"
                  ngbDropdownItem>
            {{ item.name }}
          </button>
        </div>
      </div>
      <div class="mx-3 my-2">
        <p>{{ caseSizeData.name }}</p>
      </div>
    </div>

    <div class="d-flex flex-column"
         style="width: 200px;">
      <div ngbDropdown
           class="d-inline-block">
        <button type="button"
                class="btn btn-outline-primary"
                id="dropdownBrand"
                ngbDropdownToggle>
          Brand list
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <button type="button"
                  *ngFor="let item of brandList"
                  (click)="updateBrand(item)"
                  ngbDropdownItem>
            {{ item.name }}
          </button>
        </div>
      </div>
      <div class="mx-3 my-2">
        <p>{{ brnd.name }}</p>
      </div>
    </div>

    <div class="d-flex flex-column">
      <div ngbDropdown
           class="d-inline-block">
        <button class="btn btn-outline-primary"
                id="dropdownSeries"
                type="button"
                ngbDropdownToggle
                [attr.disabled]="enableSeries ? true : null">
          Series list
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <div *ngIf="seriesList && seriesList.length > 0">
            <button type="button"
                    *ngFor="let item of seriesList"
                    (click)="updateSeries(item)"
                    ngbDropdownItem>
              {{ item.name }}
            </button>
          </div>
          <div *ngIf="!seriesList || seriesList.length < 1">
            <button type="button"
                    ngbDropdownItem>no series</button>
          </div>
        </div>
      </div>
      <div class="mx-3 my-2">
        <p>{{ srs.name }}</p>
      </div>
    </div>
  </div>

  <div>
    <textarea class="form-control"
              id="floatingTextarea"
              formControlName="description"></textarea>
  </div>

  <button type="submit"
          class="form-group btn btn-dark my-2 border border-primary">Submit</button>
  <button *ngIf="res?.id"
          (click)="delete(id)"
          class="btn btn-danger m-2 border border-secondary">Delete</button>
</form>
