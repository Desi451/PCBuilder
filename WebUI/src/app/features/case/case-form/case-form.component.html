<form [formGroup]="caseForm"
      (ngSubmit)="executeForm()">

  <div class="row">
    <div class="col-md-6 my-2">
      <input type="text"
             class="form-control"
             id="name"
             formControlName="name"
             placeholder="Case name">
    </div>
    <div class="col-md-6 my-2">
      <input type="text"
             class="form-control"
             id="model"
             formControlName="model"
             placeholder="Case model">
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 my-2">
      <input type="number"
             class="form-control"
             id="height"
             formControlName="height"
             placeholder="Height">
    </div>
    <div class="col-md-4 my-2">
      <input type="number"
             class="form-control"
             id="width"
             formControlName="width"
             placeholder="Width">
    </div>
    <div class="col-md-4 my-2">
      <input type="number"
             class="form-control"
             id="deepth"
             formControlName="deepth"
             placeholder="Depth">
    </div>
  </div>

  <div class="row">
    <div class="col-md-4">
      <div ngbDropdown
           class="d-inline-block">
        <button type="button"
                class="btn btn-outline-primary"
                id="dropdownCaseSize"
                ngbDropdownToggle>
          Case Size
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <button type="button"
                  *ngFor="let item of caseSizesList"
                  (click)="updateCaseSize(item)"
                  ngbDropdownItem>
            {{ item.name }}
          </button>
        </div>
      </div>
      <div class="mx-3 my-2">
        <p>{{ caseSizeData.name }}</p>
      </div>
    </div>
    <div class="col-md-4">
      <div ngbDropdown
           class="d-inline-block">
        <button type="button"
                class="btn btn-outline-primary"
                id="dropdownBrand"
                ngbDropdownToggle>
          Brand list
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <button type="button"
                  *ngFor="let item of brandList"
                  (click)="updateBrand(item)"
                  ngbDropdownItem>
            {{ item.name }}
          </button>
        </div>
      </div>
      <div class="mx-3 my-2">
        <p>{{ brnd.name }}</p>
      </div>
    </div>
    <div class="col-md-4">
      <div ngbDropdown
           class="d-inline-block">
        <button class="btn btn-outline-primary"
                id="dropdownSeries"
                type="button"
                ngbDropdownToggle
                [attr.disabled]="enableSeries ? true : null">
          Series list
        </button>
        <div ngbDropdownMenu
             aria-labelledby="dropdownBasic1">
          <div *ngIf="seriesList && seriesList.length > 0">
            <button type="button"
                    *ngFor="let item of seriesList"
                    (click)="updateSeries(item)"
                    ngbDropdownItem>
              {{ item.name }}
            </button>
          </div>
          <div *ngIf="!seriesList || seriesList.length < 1">
            <button type="button"
                    ngbDropdownItem>no series</button>
          </div>
        </div>
      </div>
      <div *ngIf="srs.name" class="mx-3 my-2">
        <p>selected: {{ srs.name }}</p>
      </div>
    </div>
  </div>

  <!-- Description -->
  <div class="row">
    <div class="col-12">
      <textarea class="form-control"
                id="floatingTextarea"
                formControlName="description"></textarea>
    </div>
  </div>

  <!-- Buttons -->
  <div class="row mt-2">
    <div class="col-md-6">
      <button type="submit"
              class="form-group btn btn-dark border border-primary btn-block">Submit</button>
    </div>
    <div class="col-md-6">
      <button *ngIf="res?.id"
              (click)="delete(id)"
              class="btn btn-danger border border-secondary btn-block">Delete</button>
    </div>
  </div>
</form>
