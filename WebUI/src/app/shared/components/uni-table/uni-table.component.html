<form>
	<div class="mb-3 row">
		<div class="col-xs-3 col-sm-auto">
			<input
				id="table-complete-search"
				type="text"
				class="form-control bg-dark border-primary text-light"
				name="searchTerm"
			/>
		</div>
      <div class="col-12 col-md-auto fw-bold ">
        <button type="button" class="btn btn-dark border-primary">
          <i class="bi bi-search"></i>
        </button>
      </div>
	</div>
</form>

<table class="table table-bordered table-dark border-primary rounded-1 overflow-hidden">
  <thead>
    <tr class="text-center">
      <th class="col">{{ columns[0] }}</th>
      <th *ngFor="let column of columns.slice(1)">{{ column }}</th>
      <th>actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of data">
      <td class="col-1 text-center">{{ row[columns[0]] }}</td>
      <td *ngFor="let column of columns.slice(1)">{{ row[column] }}</td>
      <td class="col-1 text-center">
        <button type="button" class="btn btn-link btn-sm px-1" mdbRipple rippleColor="dark">
          <i class="bi bi-pencil-square"></i>
        </button>
        <button type="button" class="btn btn-link btn-sm px-1" mdbRipple rippleColor="dark">
          <i class="bi bi-trash3"></i>
        </button>
        <button type="button" class="btn btn-link btn-sm px-1" mdbRipple rippleColor="dark">
          <i class="bi bi-eye"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>
