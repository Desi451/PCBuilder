<div *ngIf="!loading">
  <div class="mb-3 row">
    <div class="col-xs-4 col-sm-auto my-1">
      <input id="table-complete-search"
             type="text"
             class="form-control bg-dark border-primary text-light"
             name="searchTerm"
             [(ngModel)]="searchTerm"
             (ngModelChange)="onSearchTermChange()" />
    </div>

    <div class="col-12 col-md-auto fw-bold d-flex">
      <button
      (click)="onAddClick()"
      type="button"
      class="btn btn-dark border-primary my-1">
      Add
      <i class="bi bi-plus-circle"></i>
      </button>
    </div>
  </div>

  <table class="table table-bordered table-dark border-primary rounded-1 overflow-hidden">
    <thead>
      <tr class="text-center">
        <th class="" (click)="onSortColumnClick(columns[0])">{{ columns[0] }}</th>
        <th class="col-3" *ngFor="let column of columns.slice(1)" (click)="onSortColumnClick(column)">{{ column }}</th>
        <th>actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of slicedData">
        <td class="col-1 text-center">{{ row[columns[0]] }}</td>
        <td *ngFor="let column of columns.slice(1)">{{ row[column] }}</td>
        <td class="col-1 text-center">
          <button type="button"
                  class="btn btn-link btn-sm px-1"
                  mdbRipple
                  rippleColor="dark"
                  (click)="onEditClick(row)">
            <i class="bi bi-pencil-square"></i>
          </button>
          <button type="button"
                  class="btn btn-link btn-sm px-1"
                  mdbRipple
                  rippleColor="dark"
                  (click)="onViewClick(row)">
            <i class="bi bi-eye"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between p-2">
    <ngb-pagination [collectionSize]="data.length"
                  [(page)]="page"
                  [pageSize]="pageSize"
                  [maxSize]="maxSize"
                  [rotate]="rotate"
                  [ellipses]="ellipses"
                  (pageChange)="onPageChange($event)">
  </ngb-pagination>
  </div>
</div>

<div class="d-flex justify-content-center my-5">
  <div *ngIf="loading" class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status">
  </div>
</div>
