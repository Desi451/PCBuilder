<div class="d-flex flex-column"
  style="min-height: 100vh;">

  <nav class="navbar navbar-light bg-dark border-bottom border-info-subtle">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="#">
        <div>
          <i class="bi bi-pc-display"></i>
          <small class="fw-bold p-3 text-light"> PCBuilder</small>
        </div>
      </a>

      <div class="d-flex">
        @if (!userId) {
          <a href="login" type="button" class="btn btn-primary">Login</a>
        }
        @if (userId) {
          <a [href]="'editprofile/' + userId" type="button" class="btn btn-primary ms-2">Profile</a>
        }
        @if (userId) {
          <a (click)="logout()" type="button" class="btn btn-primary ms-2">Logout</a>
        }
      </div>
    </div>
  </nav>


  <div class="d-flex flex-grow-1">

    <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark"
      style="width: 240px; position: sticky; top: 0; overflow-y: auto;">
      <a href="/"
        class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <svg class="bi pe-none me-2"
          width="40"
          height="3">
          <use xlink:href="#bootstrap" />
        </svg>
      </a>
      <hr>
        <ul  class="nav nav-pills flex-column mb-auto">
          @if (userRank==2) {
            <li class="nav-item">
              <a href="brand"
                class="nav-link text-white"
                aria-current="page">
                <i class="bi bi-building"></i>
                Brand's
              </a>
            </li>
          }
          <li class="nav-item">
            <a href="case"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-pc"></i>
              Case's
            </a>
          </li>
          <li class="nav-item">
            <a href="cpu"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-cpu"></i>
              CPU's
            </a>
          </li>
          <li class="nav-item">
            <a href="gpu"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-gpu-card"></i>
              GPU's
            </a>
          </li>
          <li class="nav-item">
            <a href="ram"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-memory"></i>
              RAM memories
            </a>
          </li>
          <li class="nav-item">
            <a href="ssd"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-device-ssd"></i>
              SSD's
            </a>
          </li>
          <li class="nav-item">
            <a href="drive"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-device-hdd"></i>
              HDD's
            </a>
          </li>
          <li class="nav-item">
            <a href="psu"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-battery-charging"></i>
              PSU's
            </a>
          </li>
          <li class="nav-item">
            <a href="mobo"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-motherboard"></i>
              MOBO's
            </a>
          </li>
          @if (userRank==2) {
            <li class="nav-item">
              <a href="slot"
                class="nav-link text-white"
                aria-current="page">
                <i class="bi bi-hdmi"></i>
                Interfaces
              </a>
            </li>
          }
          <li class="nav-item">
            <a href="computer"
              class="nav-link text-white"
              aria-current="page">
              <i class="bi bi-pc-display"></i>
              Computers
            </a>
          </li>
        </ul>
        <hr>
        </div>

        <div class="p-2 flex-grow-1 mx-5">
          <router-outlet></router-outlet>
        </div>

        <!-- <div class="p-2 flex-grow-1 mx-5 d-flex justify-content-center align-items-center">
        <h1 class="text-center my-auto">Welcome to PCBuilder!</h1>
        <h1 class="mx-3"><i class="bi bi-pc-display-horizontal"></i></h1>
      </div> -->
    </div>

    <footer class="footer text-center mt-auto py-3 bg-dark border-top border-info-subtle">
      <div class="container">
        <span class="text-body-secondary"><i class="bi bi-c-circle"></i> PCBuilder</span>
      </div>
    </footer>
  </div>
